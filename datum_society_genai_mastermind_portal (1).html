          realtimeChannel.postMessage(payload);

        if (saved) {
          const parsed = JSON.parse(saved);
          if (parsed && parsed.apiKey && parsed.projectId) {

      }
      return DEFAULT_FIREBASE_CONFIG;

    function isUserActivelyTyping() {
      const el = document.activeElement;
      if (!el) return false;
      const tag = el.tagName;
      return (tag === "INPUT" || tag === "TEXTAREA" || tag === "SELECT") && el.type !== "checkbox" && el.type !== "file";
    }

    function safeRealtimeRender() {
      renderHeaderControls();
      renderBrandingLogos();
      if (isUserActivelyTyping()) {
        const activeEl = document.activeElement;
        if (activeEl && !activeEl.dataset.deferredSyncAttached) {
          activeEl.dataset.deferredSyncAttached = "true";
          activeEl.addEventListener(
            "blur",
            () => {
              delete activeEl.dataset.deferredSyncAttached;
              renderApp();
            },
            { once: true }
          );
        }
        return;
      }
      renderApp();
    }

    async function initFirebaseConnection() {
      try {
        for (const unsub of unsubscribers) {
          if (typeof unsub === "function") unsub();
        }
        unsubscribers = [];

        const cfg = getActiveFirebaseConfig();
        const existingApps = getApps();
        for (const appInst of existingApps) {
          await deleteApp(appInst).catch(() => {});
        }

        firebaseApp = initializeApp(cfg, "datum_challenge_app");
        auth = getAuth(firebaseApp);
        db = getFirestore(firebaseApp);

        if (
          typeof window.__initial_auth_token === "string" &&
          window.__initial_auth_token.length > 0 &&
          cfg.projectId !== DEFAULT_FIREBASE_CONFIG.projectId
        ) {
          await signInWithCustomToken(auth, window.__initial_auth_token);
        } else {
          await signInAnonymously(auth);
        }

        onAuthStateChanged(auth, async (user) => {
          if (user) {
            await seedDefaultsIfEmpty();
            attachRealtimeListeners();
            await syncAllFromFirestore(false);
          }
        });
      } catch (err) {
        console.error("Firebase init error:", err);
        updateDbStatusUI(false, "DB OFFLINE");
        showToast("Database connection error: " + (err.message || "Check Firebase rules"), "error");
      }
    }

    async function seedDefaultsIfEmpty() {
      if (!db) return;
      try {
        const cfgSnap = await getDoc(getDocRef(COL_CONFIG, "main"));
        if (!cfgSnap.exists()) {
          await setDoc(getDocRef(COL_CONFIG, "main"), DEFAULT_CONFIG);
        }

        const probSnap = await getDocs(getColRef(COL_PROBLEMS));
        if (probSnap.empty) {
          for (const p of DEFAULT_PROBLEMS) {
            await setDoc(getDocRef(COL_PROBLEMS, p.id), p);
          }
        }

        const judgeSnap = await getDocs(getColRef(COL_JUDGES));
        if (judgeSnap.empty) {
          for (const j of DEFAULT_JUDGES) {
            await setDoc(getDocRef(COL_JUDGES, j.id), j);
          }
        }
      } catch (err) {
        console.warn("Seed check skipped:", err.message);
      }
    }

    function attachRealtimeListeners() {
      if (!db) return;

      unsubscribers.push(
        onSnapshot(getDocRef(COL_CONFIG, "main"), (snap) => {
          if (snap.exists()) {
            const incoming = snap.data();
            state.config = {
              ...DEFAULT_CONFIG,
              ...incoming,
              mastermind: { ...DEFAULT_CONFIG.mastermind, ...(incoming.mastermind || {}) }
            };
            safeRealtimeRender();
          }
        })
      );

      unsubscribers.push(
        onSnapshot(getColRef(COL_STUDENTS), (snap) => {
          state.students = snap.docs
            .map((d) => d.data())
            .sort((a, b) => String(b.createdAt || "").localeCompare(String(a.createdAt || "")));
          const subCount = state.teams.filter((t) => t.status === "SUBMITTED").length;
          updateDbStatusUI(true, `LIVE SYNC • ${state.teams.length} TEAMS (${subCount} SUB)`);
          if (state.route === "admin" && state.adminTab === "registrations") {
            updateAdminRegistrationsList();
          } else {
            safeRealtimeRender();
          }
        })
      );

      unsubscribers.push(
        onSnapshot(getColRef(COL_TEAMS), (snap) => {
          const prevSubmittedIds = new Set(
            state.teams.filter((t) => t.status === "SUBMITTED").map((t) => t.id)
          );
          state.teams = snap.docs
            .map((d) => d.data())
            .sort((a, b) => String(b.createdAt || "").localeCompare(String(a.createdAt || "")));

          const subCount = state.teams.filter((t) => t.status === "SUBMITTED").length;
          updateDbStatusUI(true, `LIVE SYNC • ${state.teams.length} TEAMS (${subCount} SUB)`);

          if (state.isAdmin || state.activeJudgeId) {
            for (const t of state.teams) {
              if (t.status === "SUBMITTED" && !prevSubmittedIds.has(t.id) && prevSubmittedIds.size > 0) {
                showToast(`Live Submission Received: "${t.teamName}" just submitted!`, "info");
              }
            }
          }

          safeRealtimeRender();
        })
      );

      unsubscribers.push(
        onSnapshot(getColRef(COL_PROBLEMS), (snap) => {
          if (!snap.empty) {
            state.problems = snap.docs
              .map((d) => d.data())
              .sort((a, b) => String(a.code || "").localeCompare(String(b.code || "")));
            safeRealtimeRender();
          }
        })
      );

      unsubscribers.push(
        onSnapshot(getColRef(COL_ANNOUNCEMENTS), (snap) => {
          state.announcements = snap.docs
            .map((d) => d.data())
            .sort((a, b) => String(b.createdAt || "").localeCompare(String(a.createdAt || "")));
          safeRealtimeRender();
        })
      );

      unsubscribers.push(
        onSnapshot(getColRef(COL_PRIZES), (snap) => {
          state.prizes = snap.docs
            .map((d) => d.data())
            .sort((a, b) => Number(a.order || 0) - Number(b.order || 0));
          safeRealtimeRender();
        })
      );

      unsubscribers.push(
        onSnapshot(getColRef(COL_JUDGES), (snap) => {
          if (!snap.empty) {
            state.judges = snap.docs
              .map((d) => d.data())
              .sort((a, b) => String(a.seatLabel || "").localeCompare(String(b.seatLabel || "")));
            safeRealtimeRender();
          }
        })
      );
    }

    async function syncAllFromFirestore(showFeedback = false) {
      if (!db) return;
      try {
        const [cfgSnap, stuSnap, teamSnap, probSnap, annSnap, prizeSnap, judgeSnap] = await Promise.all([
          getDoc(getDocRef(COL_CONFIG, "main")),
          getDocs(getColRef(COL_STUDENTS)),
          getDocs(getColRef(COL_TEAMS)),
          getDocs(getColRef(COL_PROBLEMS)),
          getDocs(getColRef(COL_ANNOUNCEMENTS)),
          getDocs(getColRef(COL_PRIZES)),
          getDocs(getColRef(COL_JUDGES))
        ]);

        if (cfgSnap.exists()) {
          const incoming = cfgSnap.data();
          state.config = {
            ...DEFAULT_CONFIG,
            ...incoming,
            mastermind: { ...DEFAULT_CONFIG.mastermind, ...(incoming.mastermind || {}) }
          };
        }
        state.students = stuSnap.docs
          .map((d) => d.data())
          .sort((a, b) => String(b.createdAt || "").localeCompare(String(a.createdAt || "")));
        state.teams = teamSnap.docs
          .map((d) => d.data())
          .sort((a, b) => String(b.createdAt || "").localeCompare(String(a.createdAt || "")));

        if (!probSnap.empty) {
          state.problems = probSnap.docs
            .map((d) => d.data())
            .sort((a, b) => String(a.code || "").localeCompare(String(b.code || "")));
        }
        state.announcements = annSnap.docs
          .map((d) => d.data())
          .sort((a, b) => String(b.createdAt || "").localeCompare(String(a.createdAt || "")));
        state.prizes = prizeSnap.docs
          .map((d) => d.data())
          .sort((a, b) => Number(a.order || 0) - Number(b.order || 0));
        if (!judgeSnap.empty) {
          state.judges = judgeSnap.docs
            .map((d) => d.data())
            .sort((a, b) => String(a.seatLabel || "").localeCompare(String(b.seatLabel || "")));
        }

        const subCount = state.teams.filter((t) => t.status === "SUBMITTED").length;
        updateDbStatusUI(true, `LIVE SYNC • ${state.teams.length} TEAMS (${subCount} SUB)`);
        safeRealtimeRender();
        if (showFeedback) {
          showToast(`Synced ${state.students.length} students & ${state.teams.length} teams (${subCount} submitted) in real time.`);
        }
      } catch (err) {
        console.error("Sync error:", err);
        updateDbStatusUI(false, "SYNC ERROR");
        if (showFeedback) {
          showToast("Sync failed: " + err.message, "error");
        }
      }
    }

    // =========================================================================
    // 5. UTILITIES, CRYPTO, IMAGE COMPRESSION & HELPERS
    // =========================================================================
    function esc(str) {
      if (str === null || str === undefined) return "";
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;");
    }

    async function sha256(text) {
      const msgBuffer = new TextEncoder().encode(String(text));
      const hashBuffer = await crypto.subtle.digest("SHA-256", msgBuffer);
      const hashArray = Array.from(new Uint8Array(hashBuffer));
      return hashArray.map((b) => b.toString(16).padStart(2, "0")).join("");
    }

    function formatDateTime(iso) {
      if (!iso) return "—";
      try {
        return new Date(iso).toLocaleString("en-PK", {
          day: "2-digit",
          month: "short",
          year: "numeric",
          hour: "2-digit",
          minute: "2-digit"
        });
      } catch (e) {
        return String(iso);
      }
    }

    function compressImageFile(file, maxWidth = 640, preserveAlpha = false) {
      return new Promise((resolve, reject) => {
        if (!file || !file.type.startsWith("image/")) {
          reject(new Error("Please select a valid image file."));
          return;
        }
        const reader = new FileReader();
        reader.onerror = () => reject(new Error("Failed to read image file."));
        reader.onload = (ev) => {
          const img = new Image();
          img.onerror = () => reject(new Error("Invalid image data."));
          img.onload = () => {
            const canvas = document.createElement("canvas");
            let width = img.width;
            let height = img.height;
            if (width > maxWidth) {
              height = Math.round((height * maxWidth) / width);
              width = maxWidth;
            }
            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext("2d");
            ctx.drawImage(img, 0, 0, width, height);

            if (preserveAlpha) {
              let pngData = canvas.toDataURL("image/png");
              if (pngData.length > 350000 && width > 360) {
                const scale = 360 / width;
                canvas.width = 360;
                canvas.height = Math.round(height * scale);
                ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                pngData = canvas.toDataURL("image/png");
              }
              resolve(pngData);
              return;
            }

            let quality = 0.72;
            let dataUrl = canvas.toDataURL("image/png");
            if (dataUrl.length > 160000) {
              dataUrl = canvas.toDataURL("image/jpeg", quality);
              while (dataUrl.length > 130000 && quality > 0.25) {
                quality -= 0.1;
                dataUrl = canvas.toDataURL("image/jpeg", quality);
              }
            }
            resolve(dataUrl);
          };
          img.src = ev.target.result;
        };
        reader.readAsDataURL(file);
      });
    }

    function copyTextValue(text) {
      const ta = document.createElement("textarea");
      ta.value = text;
      ta.style.position = "fixed";
      ta.style.opacity = "0";
      document.body.appendChild(ta);
      ta.select();
      try {
        document.execCommand("copy");
        showToast("Copied to clipboard.");
      } catch (e) {
        showToast("Unable to copy text.", "error");
      }
      document.body.removeChild(ta);
    }

    function computeTeamScoreInfo(team) {
      if (!team || !team.judgeEvaluations || typeof team.judgeEvaluations !== "object") {
        return { avgScore: null, judgeCount: 0, remarksList: [] };
      }
      const evals = Object.values(team.judgeEvaluations).filter(
        (ev) => ev && typeof ev.totalScore === "number"
      );
      if (!evals.length) {
        return { avgScore: null, judgeCount: 0, remarksList: [] };
      }
      const sum = evals.reduce((acc, ev) => acc + Number(ev.totalScore || 0), 0);
      const avgScore = Math.round((sum / evals.length) * 10) / 10;
      const remarksList = evals
        .map((ev) => (ev.remarks ? String(ev.remarks).trim() : ""))
        .filter(Boolean);
      return { avgScore, judgeCount: evals.length, remarksList };
    }

    // =========================================================================
    // 6. TOASTS, MODALS, NAVIGATION & SMOOTH SCROLL CHOREOGRAPHY
    // =========================================================================
    function showToast(message, type = "success") {
      const container = document.getElementById("toast-container");
      if (!container) return;
      const toast = document.createElement("div");
      const borderAccent =
        type === "error"
          ? "border-rose-400/50 bg-rose-950/92 text-rose-100"
          : type === "info"
          ? "border-sky-400/50 bg-slate-900/92 text-sky-100"
          : "border-emerald-400/50 bg-slate-900/92 text-emerald-100";
      toast.className = `pointer-events-auto px-4 py-3 rounded-2xl border backdrop-blur-xl shadow-2xl text-xs sm:text-sm font-medium transition-all duration-300 ${borderAccent}`;
      toast.textContent = message;
      container.appendChild(toast);
      setTimeout(() => {
        toast.style.opacity = "0";
        toast.style.transform = "translateY(8px)";
        setTimeout(() => toast.remove(), 300);
      }, 3600);
    }

    function openModal(htmlContent, maxWidthClass = "max-w-xl") {
      const backdrop = document.getElementById("modal-backdrop");
      const box = document.getElementById("modal-box");
      if (!backdrop || !box) return;
      box.className = `lucid-modal-glass rounded-3xl ${maxWidthClass} w-full p-5 sm:p-7 relative my-auto`;
      box.innerHTML = htmlContent;
      backdrop.classList.remove("hidden");
    }

    function closeModal() {
      const backdrop = document.getElementById("modal-backdrop");
      if (backdrop) backdrop.classList.add("hidden");
    }
    window.closeModal = closeModal;

    function openConfirmModal(title, message, onConfirm, confirmLabel = "Confirm Delete") {
      openModal(`
        <div class="space-y-4">
          <div class="flex items-center justify-between">
            <h3 class="text-lg font-display font-bold text-white">${esc(title)}</h3>
            <button onclick="closeModal()" class="text-muted hover:text-white p-1">✕</button>
          </div>
          <p class="text-xs sm:text-sm text-muted leading-relaxed">${esc(message)}</p>
          <div class="flex justify-end gap-2 pt-2">
            <button onclick="closeModal()" class="btn-outline-lavender px-4 rounded-2xl text-xs">Cancel</button>
            <button id="confirm-modal-action-btn" class="min-h-[44px] px-4 rounded-2xl text-xs font-semibold bg-rose-600 hover:bg-rose-500 text-white">${esc(confirmLabel)}</button>
          </div>
        </div>
      `, "max-w-md");
      const btn = document.getElementById("confirm-modal-action-btn");
      if (btn) {
        btn.onclick = async () => {
          closeModal();
          await onConfirm();
        };
      }
    }

    function navigate(route) {
      state.route = route || "home";
      state.mobileMenuOpen = false;
      renderApp();
      window.scrollTo({ top: 0, behavior: "smooth" });
    }
    window.navigate = navigate;

    function navigateSection(sectionId) {
      if (state.route !== "home") {
        state.route = "home";
        renderApp();
      }
      requestAnimationFrame(() => {
        const target = document.getElementById(sectionId);
        if (target) {
          target.scrollIntoView({ behavior: "smooth", block: "start" });
        }
      });
    }
    window.navigateSection = navigateSection;

    function observeScrollReveals() {
      const els = document.querySelectorAll(".reveal-on-scroll");
      if (!("IntersectionObserver" in window)) {
        els.forEach((el) => el.classList.add("reveal-visible"));
        return;
      }
      const obs = new IntersectionObserver(
        (entries) => {
          entries.forEach((entry) => {
            if (entry.isIntersecting) {
              entry.target.classList.add("reveal-visible");
              obs.unobserve(entry.target);
            }
          });
        },
        { threshold: 0.08 }
      );
      els.forEach((el) => obs.observe(el));
    }

    window.addEventListener("scroll", () => {
      const bar = document.getElementById("scroll-progress-bar");
      const topBtn = document.getElementById("back-to-top-btn");
      const scrollTop = window.scrollY || document.documentElement.scrollTop;
      const docHeight = document.documentElement.scrollHeight - document.documentElement.clientHeight;
      if (bar && docHeight > 0) {
        bar.style.width = `${Math.min(100, Math.round((scrollTop / docHeight) * 100))}%`;
      }
      if (topBtn) {
        if (scrollTop > 360) {
          topBtn.classList.remove("opacity-0", "pointer-events-none", "translate-y-3");
        } else {
          topBtn.classList.add("opacity-0", "pointer-events-none", "translate-y-3");
        }
      }
    });

    // =========================================================================

    function getRoleNavigationConfig() {
      const student = getCurrentStudent();
      const judge = state.activeJudgeId
        ? state.judges.find((j) => j.id === state.activeJudgeId)
        : null;
      const isMastermindDeclared = Boolean(state.config?.mastermind?.declared);

      const publicPages = [
        { id: "home", label: "Overview" },
        { id: "problems", label: "Problem Sets" },
        { id: "requirements", label: "Requirements" },
        { id: "rules", label: "Rules & IP" },
        { id: "journey", label: "Journey" },
        { id: "mastermind", label: isMastermindDeclared ? "Mastermind ★" : "Mastermind", highlight: true }
      ];

      let activeRole = "public";
      if (state.route === "admin" && state.isAdmin) {
        activeRole = "admin";
      } else if (state.route === "judge" && judge) {
        activeRole = "judge";
      } else if (state.route === "workspace" && student) {
        activeRole = "student";
      } else if (state.isAdmin) {
        activeRole = "admin";
      } else if (judge) {
        activeRole = "judge";
      } else if (student) {
        activeRole = "student";
      }

            heading: cap.heading || cap.title || `Capability ${idx + 1}`,

    window.openStudentAuthModal = openStudentAuthModal;

    window.handleIdCardFileChange = async function (e) {
      const file = e.target.files && e.target.files[0];
      if (!file) return;
      try {
        const compressed = await compressImageFile(file, 640);
        state.pendingIdCardBase64 = compressed;
        const preview = document.getElementById("reg-idcard-preview");
        if (preview) {
          preview.classList.remove("hidden");
          preview.innerHTML = `<img src="${compressed}" alt="ID Preview" class="max-h-36 rounded-2xl border border-white/20 object-contain" />`;
        }
        showToast("Student ID Card attached and compressed.");
      } catch (err) {
        showToast(err.message || "Could not process ID Card image.", "error");
      }
    };

    window.handleStudentRegisterSubmit = async function (e) {
      e.preventDefault();
      if (!db) {
        showToast("Database is still connecting.", "error");
        return;
      }
      const fullName = document.getElementById("reg-fullname").value.trim();
      const regNo = document.getElementById("reg-regno").value.trim().toUpperCase();
      const email = document.getElementById("reg-email").value.trim().toLowerCase();
      const department = document.getElementById("reg-dept").value.trim();
      const password = document.getElementById("reg-password").value;

      if (!state.pendingIdCardBase64) {
        showToast("Please upload your Student ID Card photo.", "error");
        return;
      }

      try {
        const existingSnap = await getDoc(getDocRef(COL_STUDENTS, regNo));
        if (existingSnap.exists()) {
          showToast("This Registration Number is already registered.", "error");
          return;
        }

        const passwordHash = await sha256(password);
        const studentRecord = {
          regNo,
          fullName,
          email,
          department,
          passwordHash,
          idCardImage: state.pendingIdCardBase64,
          status: "PENDING",
          teamId: "",
          createdAt: new Date().toISOString()
        };

        await setDoc(getDocRef(COL_STUDENTS, regNo), studentRecord);
        state.currentStudentRegNo = regNo;
        localStorage.setItem(STUDENT_SESSION_KEY, regNo);
        state.pendingIdCardBase64 = "";
        broadcastCrossPortalPulse("STUDENT_REGISTERED", `New student registration: ${regNo}`);
        await syncAllFromFirestore(false);
        closeModal();
        showToast("Registration submitted! Awaiting Admin ID approval.");
        navigate("workspace");
      } catch (err) {
        console.error(err);
        showToast("Registration failed: " + err.message, "error");
      }
    };

    window.handleStudentLoginSubmit = async function (e) {
      e.preventDefault();
      if (!db) return;
      const ident = document.getElementById("login-identifier").value.trim();
      const password = document.getElementById("login-password").value;

      try {
        await syncAllFromFirestore(false);
        const passwordHash = await sha256(password);
        const found = state.students.find(
          (s) =>
            (s.regNo.toUpperCase() === ident.toUpperCase() || s.email.toLowerCase() === ident.toLowerCase()) &&
            s.passwordHash === passwordHash
        );

        if (!found) {
          showToast("Invalid registration number/email or password.", "error");
          return;
        }

        state.currentStudentRegNo = found.regNo;
        localStorage.setItem(STUDENT_SESSION_KEY, found.regNo);
        closeModal();
        showToast(`Welcome back, ${found.fullName}.`);
        navigate("workspace");
      } catch (err) {
        showToast("Sign-in error: " + err.message, "error");
      }
    };

    window.handleStudentLogout = function () {
      state.currentStudentRegNo = "";
      localStorage.removeItem(STUDENT_SESSION_KEY);
      showToast("Signed out.");
      navigate("home");
    };

    // =========================================================================
    // 12. PROBLEM-DRIVEN TEAM ENROLLMENT
    // =========================================================================
    window.startTeamEnrollmentForProblem = async function (problemId) {
      const student = getCurrentStudent();
      if (!student) {
        showToast("Please register or sign in first.", "info");
        openStudentAuthModal("register");
        return;
      }
      await syncAllFromFirestore(false);
      const freshStudent = getCurrentStudent();
      if (freshStudent.status !== "APPROVED") {
        showToast("Your Student ID must be APPROVED by Admin before enrolling a team.", "error");
        navigate("workspace");
        return;
      }
      const existingTeam = getStudentTeam(freshStudent);
      if (existingTeam) {
        showToast("You are already enrolled in a team.", "info");
        navigate("workspace");
        return;
      }

      state.selectedProblemId = problemId;
      state.enrollMembersDraft = [freshStudent.regNo];
      state.enrollSearchQuery = "";
      openTeamEnrollModal(problemId);
    };

    function openTeamEnrollModal(problemId) {
      const prob = state.problems.find((p) => p.id === problemId) || state.problems[0];
      const head = getCurrentStudent();
      const minSize = Number(state.config.minTeamSize || 2);
      const maxSize = Number(state.config.maxTeamSize || 4);

      openModal(`
        <div class="space-y-5">
          <div class="flex items-center justify-between">
            <div>
              <span class="text-[11px] font-mono uppercase tracking-wider text-datum-amber">${esc(prob.code)} • ${esc(prob.title)}</span>
              <h3 class="text-xl font-display font-bold text-white mt-0.5">Enroll Team (Head + Members)</h3>
            </div>
            <button onclick="closeModal()" class="text-muted hover:text-white p-1.5">✕</button>
          </div>

          <form onsubmit="handleTeamEnrollmentSubmit(event, '${esc(prob.id)}')" class="space-y-4">
            <div>
              <label class="block text-xs text-muted mb-1">Team Name</label>
              <input id="enroll-team-name" type="text" required class="input-dark" />
            </div>

            <div class="card-elevated rounded-2xl p-4 space-y-2.5">
              <div class="flex items-center justify-between text-xs">
                <span class="font-semibold text-white">Team Roster (<span id="enroll-count-label">${state.enrollMembersDraft.length}</span> / ${maxSize} max, min ${minSize})</span>
                <span class="font-mono text-[11px] text-datum-cyan">Head: ${esc(head.regNo)}</span>
              </div>
              <div id="enroll-selected-roster" class="space-y-2"></div>
            </div>

            <div class="space-y-2">
              <label class="block text-xs text-muted">Add Verified Account Holder by Registration Number</label>
              <div class="flex gap-2">
                <input id="enroll-reg-lookup" type="text" class="input-dark font-mono uppercase" />
                <button type="button" onclick="addMemberByRegNo()" class="btn-outline-lavender px-4 rounded-2xl text-xs shrink-0">
                  Verify &amp; Add
                </button>
              </div>
            </div>

            <div class="space-y-2">
              <label class="block text-xs text-muted">Filter Verified Account Holders Directory</label>
              <input id="enroll-dir-search" type="text" value="${esc(state.enrollSearchQuery)}" oninput="handleEnrollDirSearch(this.value)" class="input-dark text-xs" />

          </form>
        </div>
      `, "max-w-xl");

      renderEnrollRosterUi();
      updateEnrollmentDirectoryList();
    }

    function renderEnrollRosterUi() {
      const container = document.getElementById("enroll-selected-roster");
      const countLbl = document.getElementById("enroll-count-label");
      const head = getCurrentStudent();
      if (countLbl) countLbl.textContent = String(state.enrollMembersDraft.length);
      if (!container) return;

      container.innerHTML = state.enrollMembersDraft
        .map((regNo) => {
          const st = state.students.find((s) => s.regNo === regNo);
          const isHead = head && regNo === head.regNo;
          return `
            <div class="flex items-center justify-between gap-2 px-3 py-2 rounded-xl bg-white/[0.06] border border-white/10 text-xs">
              <div>
                <span class="font-mono font-bold text-white">${esc(regNo)}</span>
                <span class="text-muted ml-2">${esc(st ? st.fullName : "")}</span>
              </div>
              ${
                isHead
                  ? `<span class="px-2 py-0.5 rounded-full bg-amber-500/20 text-amber-200 font-mono text-[10px]">TEAM HEAD</span>`
                  : `<button type="button" onclick="removeEnrollMember('${esc(regNo)}')" class="text-rose-300 hover:text-rose-200 font-semibold">Remove</button>`
              }
            </div>
          `;
        })
        .join("");
    }

    window.handleEnrollDirSearch = function (val) {
      state.enrollSearchQuery = val;
      updateEnrollmentDirectoryList();
    };

    function updateEnrollmentDirectoryList() {
      const listEl = document.getElementById("enroll-dir-list");
      if (!listEl) return;
      const q = state.enrollSearchQuery.trim().toLowerCase();
      const eligible = state.students.filter((s) => {
        if (s.status !== "APPROVED") return false;
        if (state.enrollMembersDraft.includes(s.regNo)) return false;
        if (getStudentTeam(s)) return false;
        if (!q) return true;
        return s.regNo.toLowerCase().includes(q) || s.fullName.toLowerCase().includes(q);
      });

      if (!eligible.length) {
        listEl.innerHTML = `<p class="text-xs text-muted py-2">No available verified students matching filter.</p>`;
        return;
      }

      listEl.innerHTML = eligible
        .map(
          (s) => `
          <div class="flex items-center justify-between gap-2 px-3 py-2 rounded-xl bg-white/[0.04] border border-white/10 text-xs">
            <div class="min-w-0 truncate">
              <span class="font-mono font-semibold text-white">${esc(s.regNo)}</span>
              <span class="text-muted ml-2">${esc(s.fullName)}</span>
            </div>
            <button type="button" onclick="addEnrollMemberDirect('${esc(s.regNo)}')" class="btn-outline-lavender px-2.5 py-1 min-h-[32px] rounded-xl text-[11px] shrink-0">
              + Add
            </button>
          </div>
        `
        )
        .join("");
    }

    window.addEnrollMemberDirect = function (regNo) {
      const maxSize = Number(state.config.maxTeamSize || 4);
      if (state.enrollMembersDraft.length >= maxSize) {
        showToast(`Maximum team size is ${maxSize} members.`, "error");
        return;
      }
      if (!state.enrollMembersDraft.includes(regNo)) {
        state.enrollMembersDraft.push(regNo);
        renderEnrollRosterUi();
        updateEnrollmentDirectoryList();
      }
    };

    window.addMemberByRegNo = function () {
      const input = document.getElementById("enroll-reg-lookup");
      if (!input) return;
      const regNo = input.value.trim().toUpperCase();
      if (!regNo) return;

      const maxSize = Number(state.config.maxTeamSize || 4);
      if (state.enrollMembersDraft.length >= maxSize) {
        showToast(`Maximum team size is ${maxSize} members.`, "error");
        return;
      }
      if (state.enrollMembersDraft.includes(regNo)) {
        showToast("Member already added to roster.", "info");
        return;
      }
      const student = state.students.find((s) => s.regNo === regNo);
      if (!student) {
        showToast("No student account found with that Registration Number.", "error");
        return;
      }
      if (student.status !== "APPROVED") {
        showToast("That student's ID Card is not yet approved by Admin.", "error");
        return;
      }
      if (getStudentTeam(student)) {
        showToast("That student is already enrolled in another team.", "error");
        return;
      }

      state.enrollMembersDraft.push(regNo);
      input.value = "";
      renderEnrollRosterUi();
      updateEnrollmentDirectoryList();
      showToast(`Added ${student.fullName} (${regNo}).`);
    };

    window.removeEnrollMember = function (regNo) {
      const head = getCurrentStudent();
      if (head && regNo === head.regNo) return;
      state.enrollMembersDraft = state.enrollMembersDraft.filter((r) => r !== regNo);
      renderEnrollRosterUi();
      updateEnrollmentDirectoryList();
    };

    window.handleTeamEnrollmentSubmit = async function (e, problemId) {
      e.preventDefault();
      if (!db) return;
      const teamName = document.getElementById("enroll-team-name").value.trim();
      const head = getCurrentStudent();
      const minSize = Number(state.config.minTeamSize || 2);
      const maxSize = Number(state.config.maxTeamSize || 4);

      if (state.enrollMembersDraft.length < minSize || state.enrollMembersDraft.length > maxSize) {
        showToast(`Team must have between ${minSize} and ${maxSize} verified members.`, "error");
        return;
      }

      try {
        const teamId = "team_" + Date.now();
        const teamRecord = {
          id: teamId,
          teamName,
          problemId,
          headRegNo: head.regNo,
          memberRegNos: [...state.enrollMembersDraft],
          milestones: [false, false, false, false, false, false],
          deliverables: {
            githubUrl: "",
            liveUrl: "",
            videoDriveUrl: "",
            drivePublicConfirmed: false,
            aiChatLink: "",
            architectureUrl: "",
            architectureImage: "",
            runInstructions: ""
          },
          status: "ENROLLED",
          submissionLocked: false,
          submissionCount: 0,
          copyrightAccepted: false,
          copyrightAcceptedAt: "",
          groupPhotoRequested: false,
          groupPhotoRequestNote: "",
          groupPhotoUrl: "",
          groupPhotoUploadedAt: "",
          submittedBy: "",
          resubmissionNote: "",
          presentationSlot: "",
          judgeEvaluations: {},
          createdAt: new Date().toISOString()
        };

        await setDoc(getDocRef(COL_TEAMS, teamId), teamRecord);
        for (const regNo of state.enrollMembersDraft) {
          await updateDoc(getDocRef(COL_STUDENTS, regNo), { teamId });
        }

        broadcastCrossPortalPulse("TEAM_ENROLLED", `Team "${teamName}" enrolled.`);
        await syncAllFromFirestore(false);
        closeModal();
        showToast(`Team "${teamName}" enrolled successfully!`);
        navigate("workspace");
      } catch (err) {
        console.error(err);
        showToast("Team enrollment failed: " + err.message, "error");
      }
    };

      if (!team) return false;
      if (team.submissionLocked === true) return true;
      if (team.status === "SUBMITTED" && team.submissionLocked !== false) return true;
      return false;
    }

        state.pendingGroupPhotoBase64 = compressed;
        showToast("Group photo selected. Click 'Upload Team Group Photo' to save.");
        renderApp();
      } catch (err) {
        showToast(err.message || "Could not process group photo.", "error");
      }

    window.saveTeamGroupPhoto = async function (teamId) {
      if (!db) return;
      if (!state.pendingGroupPhotoBase64) {
        showToast("Please choose a group photo image first.", "error");
        return;
      }
      try {
        await updateDoc(getDocRef(COL_TEAMS, teamId), {
          groupPhotoUrl: state.pendingGroupPhotoBase64,
          groupPhotoUploadedAt: new Date().toISOString()
        });
        state.pendingGroupPhotoBase64 = "";
        broadcastCrossPortalPulse("GROUP_PHOTO_UPLOADED", "A team uploaded their official group photo.");
        await syncAllFromFirestore(false);
        showToast("Official Team Group Photo saved and synced to Admin & Mastermind portals.");
      } catch (err) {
        showToast("Failed to upload group photo: " + err.message, "error");
      }
    };

    window.handleArchDiagramSelect = async function (e) {
      const file = e.target.files && e.target.files[0];
      if (!file) return;
      try {
        const compressed = await compressImageFile(file, 720);
        state.pendingArchDiagramBase64 = compressed;
        const preview = document.getElementById("sub-arch-preview");
        if (preview) {
          preview.classList.remove("hidden");
          preview.innerHTML = `<img src="${compressed}" alt="Architecture Diagram Preview" class="max-h-40 rounded-2xl border border-white/20 object-contain" />`;
        }
        showToast("Architecture diagram attached.");

        showToast(err.message || "Could not process diagram image.", "error");

    window.toggleTeamMilestone = async function (teamId, idx, checked) {
      if (!db) return;
      const team = state.teams.find((t) => t.id === teamId);
      if (!team) return;
      const updated = Array.isArray(team.milestones) ? [...team.milestones] : [false, false, false, false, false, false];
      updated[idx] = checked;
      try {
        await updateDoc(getDocRef(COL_TEAMS, teamId), { milestones: updated });
        broadcastCrossPortalPulse("MILESTONE_UPDATED", "");
        await syncAllFromFirestore(false);
      } catch (err) {
        showToast("Failed to update milestone.", "error");
      }
    };

    window.handleTeamDeliverablesSubmit = async function (e, teamId) {
      e.preventDefault();
      if (!db) return;

      const student = getCurrentStudent();
      const team = state.teams.find((t) => t.id === teamId);
      if (!student || !team) return;

      if (student.regNo !== team.headRegNo) {
        showToast("Unauthorized: Only the Team Head can submit the final project.", "error");
        return;
      }

      if (isTeamSubmissionLocked(team)) {
        showToast("Submission is already locked. Contact Admin to request re-submission.", "error");
        renderApp();
        return;
      }

      const githubUrl = document.getElementById("sub-github-url").value.trim();
      const liveUrl = document.getElementById("sub-live-url").value.trim();
      const videoDriveUrl = document.getElementById("sub-video-drive-url").value.trim();
      const drivePublicConfirmed = Boolean(document.getElementById("sub-drive-public-check")?.checked);
      const copyrightAccepted = Boolean(document.getElementById("sub-copyright-check")?.checked);
      const aiChatLink = document.getElementById("sub-aichat-url").value.trim();
      const architectureUrl = document.getElementById("sub-arch-url").value.trim();
      const architectureImage = state.pendingArchDiagramBase64 || team.deliverables?.architectureImage || "";
      const runInstructions = document.getElementById("sub-instructions").value.trim();

      if (!/^https?:\/\/(www\.)?github\.com\/.+/i.test(githubUrl)) {
        showToast("Please enter a valid GitHub repository URL (https://github.com/...).", "error");
        return;
      }
      if (!/^https?:\/\/(drive|docs)\.google\.com\/.+/i.test(videoDriveUrl)) {
        showToast("3-Minute Demo Video must be a valid Google Drive link (https://drive.google.com/...).", "error");
        return;
      }
      if (!drivePublicConfirmed) {
        showToast("Please confirm the Google Drive video is publicly viewable.", "error");
        return;
      }
      if (!copyrightAccepted) {
        showToast("Please accept the Copyright & Showcase License Agreement before submitting.", "error");
        return;
      }
      if (!architectureUrl && !architectureImage) {
        showToast("Please provide an Architecture Diagram link or upload a diagram image.", "error");
        return;
      }

      openConfirmModal(
        "Confirm One-Time Final Submission",
        `Once you submit for "${team.teamName}", your links will be permanently locked, broadcast live to the Judges Panel & Admin Console, and cannot be modified unless the Admin unlocks a re-submission. Proceed?`,
        async () => {
          try {
            const nextCount = Number(team.submissionCount || 0) + 1;
            const nowIso = new Date().toISOString();
            const deliverables = {
              githubUrl,
              repoUrl: githubUrl,
              liveUrl,
              videoDriveUrl,
              demoVideoUrl: videoDriveUrl,
              drivePublicConfirmed: true,
              aiChatLink,
              architectureUrl,
              architectureImage,
              runInstructions
            };

            await updateDoc(getDocRef(COL_TEAMS, teamId), {
              deliverables,
              status: "SUBMITTED",
              submissionLocked: true,
              submissionCount: nextCount,
              copyrightAccepted: true,
              copyrightAcceptedAt: nowIso,
              submittedBy: student.regNo,
              resubmissionNote: "",
              submittedAt: nowIso
            });

            state.pendingArchDiagramBase64 = "";
            broadcastCrossPortalPulse("FINAL_SUBMISSION", `Team "${team.teamName}" submitted their final project!`);
            await syncAllFromFirestore(false);
            showToast("Final project submitted, locked, and synced live across all portals.");
          } catch (err) {
            showToast("Submission failed: " + err.message, "error");
          }
        },
        "Lock & Submit Now"
      );
    };

      state.activeJudgeId = matched.id;

      closeModal();

      navigate("judge");

        const bSub = b.status === "SUBMITTED" ? 1 : 0;

    window.handleJudgeScoreSubmit = async function (e, teamId, isMock) {
      e.preventDefault();
      const judge = state.judges.find((j) => j.id === state.activeJudgeId);
      if (!judge) return;

      const criteria = state.config.judgingCriteria || DEFAULT_CONFIG.judgingCriteria;
      const criteriaScores = {};
      let weightedSum = 0;
      let totalWeight = 0;

      for (const c of criteria) {
        const val = parseFloat(document.getElementById(`judge-crit-${c.id}`).value) || 0;
        criteriaScores[c.id] = val;
        weightedSum += val * Number(c.weight || 0);
        totalWeight += Number(c.weight || 0);
      }

      const totalScore = totalWeight > 0 ? Math.round((weightedSum / totalWeight) * 10) / 10 : 0;
      const remarks = document.getElementById("judge-remarks").value.trim();

      const evalPayload = {
        judgeId: judge.id,
        criteriaScores,
        totalScore,
        remarks,
        updatedAt: new Date().toISOString()
      };

      if (isMock) {
        const mockTeam = MOCK_JUDGE_TEAMS.find((m) => m.id === teamId);
        if (mockTeam) {
          mockTeam.judgeEvaluations[judge.id] = evalPayload;
        }
        showToast(`Sample evaluation saved (${totalScore}/100).`);
        renderApp();
        return;
      }

      if (!db) return;
      const team = state.teams.find((t) => t.id === teamId);
      if (!team) return;

      const updatedEvals = { ...(team.judgeEvaluations || {}), [judge.id]: evalPayload };
      try {
        await updateDoc(getDocRef(COL_TEAMS, teamId), { judgeEvaluations: updatedEvals });
        broadcastCrossPortalPulse("JUDGE_SCORED", `${judge.seatLabel} scored "${team.teamName}" (${totalScore}/100).`);
        await syncAllFromFirestore(false);
        showToast(`Evaluation saved (${totalScore}/100) and synced to Admin & Student portals.`);
      } catch (err) {
        showToast("Failed to save evaluation: " + err.message, "error");
      }
    };

    function buildAdminRegistrationsListHtml() {
      const q = state.regSearch.trim().toLowerCase();
      const filtered = state.students.filter((s) => {
        if (state.regFilter !== "ALL" && s.status !== state.regFilter) return false;
        if (!q) return true;
        return (
          s.regNo.toLowerCase().includes(q) ||
          s.fullName.toLowerCase().includes(q) ||
          s.email.toLowerCase().includes(q) ||
          s.department.toLowerCase().includes(q)
        );
      });

      if (!filtered.length) {
        return `<p class="text-xs sm:text-sm text-muted py-4 text-center">No records found.</p>`;
      }

      return filtered
        .map(
          (s) => `

            <div class="flex items-center gap-3.5 min-w-0">

                  : `<div class="w-16 h-12 rounded-2xl bg-white/10 flex items-center justify-center text-[10px] font-mono text-muted shrink-0">NO ID</div>`
              }
              <div class="min-w-0">

                <div class="text-xs font-mono text-datum-cyan mt-0.5">${esc(s.regNo)} • ${esc(s.department)}</div>

                        <div>
                          <label class="block text-xs text-muted mb-1">WhatsApp Digits (923...)</label>
                          <input id="head-wa-${idx}" type="text" value="${esc(h.whatsapp)}" required class="input-dark font-mono text-xs" />
                        </div>
                      </div>
                    </div>
                  `
                  )
                  .join("")}
              </div>

              <button type="submit" class="btn-lavender px-6 rounded-2xl text-xs sm:text-sm">Save Event Heads Details</button>
            </form>
          </div>

          <div class="card-dark rounded-[28px] p-6 sm:p-8 space-y-6">
            <h2 class="text-xl font-display font-bold text-white">Event Deadlines, Team Size, IP Policy &amp; Group Photo Rules</h2>
            <form onsubmit="handleSaveGeneralSettingsSubmit(event)" class="space-y-4">
              <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                <div>
                  <label class="block text-xs text-muted mb-1">Registration Deadline</label>
                  <input id="cfg-reg-deadline" type="text" value="${esc(cfg.registrationDeadline)}" required class="input-dark" />
                </div>
                <div>
                  <label class="block text-xs text-muted mb-1">Submission Deadline</label>
                  <input id="cfg-sub-deadline" type="text" value="${esc(cfg.submissionDeadline)}" required class="input-dark" />
                </div>
                <div>
                  <label class="block text-xs text-muted mb-1">Presentation &amp; Demo Date</label>
                  <input id="cfg-pres-date" type="text" value="${esc(cfg.presentationDate)}" required class="input-dark" />
                </div>
              </div>

              <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                <div>
                  <label class="block text-xs text-muted mb-1">Min Team Size</label>
                  <input id="cfg-min-team" type="number" min="1" max="10" value="${esc(cfg.minTeamSize)}" required class="input-dark font-mono" />
                </div>
                <div>
                  <label class="block text-xs text-muted mb-1">Max Team Size</label>
                  <input id="cfg-max-team" type="number" min="1" max="10" value="${esc(cfg.maxTeamSize)}" required class="input-dark font-mono" />
                </div>
                <div>
                  <label class="block text-xs text-muted mb-1">Challenge Tagline</label>
                  <input id="cfg-tagline" type="text" value="${esc(cfg.tagline)}" required class="input-dark" />
                </div>
              </div>

              <div>
                <label class="block text-xs text-muted mb-1">Public Copyright &amp; IP Ownership Policy Statement</label>
                <textarea id="cfg-copyright-summary" rows="2" required class="input-dark text-xs">${esc(cfg.copyrightSummary || DEFAULT_CONFIG.copyrightSummary)}</textarea>
              </div>

              <div>
                <label class="block text-xs text-muted mb-1">Pre-Declaration Team Group Photo Requirement Notice</label>
                <textarea id="cfg-groupphoto-policy" rows="2" required class="input-dark text-xs">${esc(cfg.groupPhotoPolicyNote || DEFAULT_CONFIG.groupPhotoPolicyNote)}</textarea>
              </div>

              <button type="submit" class="btn-lavender px-6 rounded-2xl text-xs sm:text-sm">Save Live Event Settings</button>
            </form>
          </div>
        </div>
      `;
    }

    window.handleBrandLogoUpload = async function (e, fieldKey) {
      const file = e.target.files && e.target.files[0];
      if (!file || !db) return;
      try {
        const compressed = await compressImageFile(file, 560, true);
        await setDoc(getDocRef(COL_CONFIG, "main"), { [fieldKey]: compressed }, { merge: true });
        broadcastCrossPortalPulse("BRANDING_UPDATED", "Official site logo updated.");
        await syncAllFromFirestore(false);
        showToast("Logo uploaded and saved to Cloud Firestore across all pages!");
      } catch (err) {
        showToast("Failed to upload logo: " + err.message, "error");
      }
    };

    window.resetBrandLogo = async function (fieldKey) {
      if (!db) return;
      try {
        await setDoc(getDocRef(COL_CONFIG, "main"), { [fieldKey]: "" }, { merge: true });
        broadcastCrossPortalPulse("BRANDING_UPDATED", "Official site logo reset to default.");
        await syncAllFromFirestore(false);
        showToast("Logo reset to default placeholder.");
      } catch (err) {
        showToast("Failed to reset logo: " + err.message, "error");
      }
    };

    window.handleEventHeadPhotoUpload = async function (e, headIdx) {
      const file = e.target.files && e.target.files[0];
      if (!file || !db) return;
      try {
        const compressed = await compressImageFile(file, 400, false);
        const updatedHeads = getEventHeadsList().map((h, i) =>
          i === headIdx ? { ...h, photoUrl: compressed } : h
        );
        await setDoc(getDocRef(COL_CONFIG, "main"), { eventHeads: updatedHeads }, { merge: true });
        broadcastCrossPortalPulse("HEADS_UPDATED", "Event Head profile picture updated.");
        await syncAllFromFirestore(false);
        showToast("Event Head profile picture saved to Cloud Firestore!");
      } catch (err) {
        showToast("Failed to upload Event Head photo: " + err.message, "error");
      }
    };

    window.removeEventHeadPhoto = async function (headIdx) {
      if (!db) return;
      try {
        const updatedHeads = getEventHeadsList().map((h, i) =>
          i === headIdx ? { ...h, photoUrl: "" } : h
        );
        await setDoc(getDocRef(COL_CONFIG, "main"), { eventHeads: updatedHeads }, { merge: true });
        broadcastCrossPortalPulse("HEADS_UPDATED", "Event Head profile picture removed.");
        await syncAllFromFirestore(false);
        showToast("Event Head profile picture removed.");
      } catch (err) {
        showToast("Failed to remove photo: " + err.message, "error");
      }
    };

    window.handleSaveEventHeadsSubmit = async function (e) {
      e.preventDefault();
      if (!db) return;
      try {
        const currentHeads = getEventHeadsList();
        const updatedHeads = currentHeads.map((h, idx) => {
          const name = document.getElementById(`head-name-${idx}`).value.trim();
          const role = document.getElementById(`head-role-${idx}`).value.trim();
          const phoneDisplay = document.getElementById(`head-phone-${idx}`).value.trim();
          const whatsapp = document.getElementById(`head-wa-${idx}`).value.trim().replace(/[^0-9]/g, "");
          const tel = whatsapp ? `+${whatsapp}` : h.tel;
          return {
            ...h,
            name,
            role,
            phoneDisplay,
            whatsapp,
            tel
          };
        });
        await setDoc(getDocRef(COL_CONFIG, "main"), { eventHeads: updatedHeads }, { merge: true });
        broadcastCrossPortalPulse("HEADS_UPDATED", "Event Heads contact details updated.");
        await syncAllFromFirestore(false);
        showToast("Event Heads details saved live!");
      } catch (err) {
        showToast("Failed to save Event Heads details: " + err.message, "error");
      }
    };

    window.handleSaveGeneralSettingsSubmit = async function (e) {
      e.preventDefault();
      if (!db) return;
      try {
        await setDoc(
          getDocRef(COL_CONFIG, "main"),
          {
            registrationDeadline: document.getElementById("cfg-reg-deadline").value.trim(),
            submissionDeadline: document.getElementById("cfg-sub-deadline").value.trim(),
            presentationDate: document.getElementById("cfg-pres-date").value.trim(),
            minTeamSize: Number(document.getElementById("cfg-min-team").value) || 2,
            maxTeamSize: Number(document.getElementById("cfg-max-team").value) || 4,
            tagline: document.getElementById("cfg-tagline").value.trim(),
            copyrightSummary: document.getElementById("cfg-copyright-summary").value.trim(),
            groupPhotoPolicyNote: document.getElementById("cfg-groupphoto-policy").value.trim()
          },
          { merge: true }
        );
        broadcastCrossPortalPulse("CONFIG_UPDATED", "Event settings updated live.");
        await syncAllFromFirestore(false);
        showToast("Event settings & IP policies saved live.");
      } catch (err) {
        showToast("Failed to save settings.", "error");
      }
    };

    function renderAdminDatabaseTab() {
      const activeCfg = getActiveFirebaseConfig();
      const rulesSnippet = `rules_version = '2';\nservice cloud.firestore {\n  match /databases/{database}/documents {\n    match /artifacts/{namespace}/public/data/{col}/{docId} {\n      allow read, write: if request.auth != null;\n    }\n  }\n}`;
      return `
        <div class="card-dark rounded-[28px] p-6 sm:p-8 space-y-5">
          <div>
            <span class="text-xs font-mono uppercase text-datum-cyan">Multi-Device Persistence</span>
            <h2 class="text-xl font-display font-bold text-white mt-0.5">Cloud Firestore Connection &amp; Security Rules</h2>
          </div>

          <div class="card-elevated rounded-2xl p-4 text-xs space-y-1 font-mono">
            <div><span class="text-muted">Active Project ID:</span> <span class="text-white">${esc(activeCfg.projectId)}</span></div>
            <div><span class="text-muted">Shared Namespace:</span> <span class="text-datum-cyan">${esc(getNamespace())}</span></div>
            <div><span class="text-muted">Connection State:</span> <span class="${state.dbConnected ? "text-emerald-300" : "text-amber-300"}">${state.dbConnected ? "CONNECTED & REAL-TIME SYNCING" : "CONNECTING"}</span></div>
          </div>

          <div class="space-y-2">
            <div class="flex items-center justify-between">
              <span class="text-xs font-semibold text-white">Required Firestore Security Rules</span>
              <button type="button" onclick="copyTextValue(\`${rulesSnippet.replace(/\n/g, "\\n")}\`)" class="btn-outline-lavender px-3 py-1 min-h-[34px] rounded-xl text-xs">Copy Rules</button>
            </div>
            <pre class="p-4 rounded-2xl bg-black/50 border border-white/15 font-mono text-xs text-datum-cyan overflow-x-auto">${esc(rulesSnippet)}</pre>
          </div>
        </div>
      `;
    }

    // =========================================================================
    // 16. MAIN VIEWPORT RENDERER & INITIALIZATION
    // =========================================================================
    function renderApp() {
      renderHeaderControls();
      renderBrandingLogos();
      const main = document.getElementById("app-main");
      if (!main) return;

      if (state.route === "home") {
        main.innerHTML = renderHomePage();
      } else if (state.route === "problems") {
        main.innerHTML = renderProblemsPage();
      } else if (state.route === "requirements") {
        main.innerHTML = renderRequirementsPage();
      } else if (state.route === "rules") {
        main.innerHTML = renderRulesPage();
      } else if (state.route === "journey") {
        main.innerHTML = renderJourneyPage();
      } else if (state.route === "mastermind") {
        main.innerHTML = renderMastermindPage();
      } else if (state.route === "workspace") {
        main.innerHTML = renderWorkspacePage();
      } else if (state.route === "judge") {
        main.innerHTML = renderJudgePortalPage();
      } else if (state.route === "admin") {
        main.innerHTML = renderAdminPage();
      } else {
        main.innerHTML = renderHomePage();
      }

      observeScrollReveals();
    }

    document.getElementById("modal-backdrop")?.addEventListener("click", (e) => {
      if (e.target && e.target.id === "modal-backdrop") {
        closeModal();
      }
    });

    // Boot Application
    renderApp();
    initFirebaseConnection();
  </script>
</body>
</html>
